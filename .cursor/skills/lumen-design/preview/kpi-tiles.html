<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>Preview — KPI tiles</title>
<link rel="stylesheet" href="../colors_and_type.css"/>

<style>html,body{margin:0;padding:20px;background:var(--bg);} .kpi-row{margin:0;}</style>
</head>
<body>
<div class="kpi-row">
  <div class="kpi">
    <div class="lbl-row">
      <div class="lbl">Revenue</div>
      <div class="delta up">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        +12.4%
      </div>
    </div>
    <div class="val">$4.82M</div>
    <svg class="sparkline" width="140" height="22" viewBox="0 0 140 22"><path d="M0,16 L15.5,14 L31.1,15 L46.6,12 L62.2,9 L77.7,7 L93.3,5 L108.8,3 L124.4,2 L140,1 L140,22 L0,22 Z" fill="rgba(63,138,92,0.18)" stroke="none"/><path d="M0,16 L15.5,14 L31.1,15 L46.6,12 L62.2,9 L77.7,7 L93.3,5 L108.8,3 L124.4,2 L140,1" fill="none" stroke="#3f8a5c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="kpi">
    <div class="lbl-row"><div class="lbl">Avg deal</div><div class="delta up">+4.8%</div></div>
    <div class="val">$18,400</div>
  </div>
  <div class="kpi">
    <div class="lbl-row"><div class="lbl">Win rate</div><div class="delta up">+2.1%</div></div>
    <div class="val">27.3%</div>
  </div>
  <div class="kpi">
    <div class="lbl-row"><div class="lbl">Churn</div><div class="delta up">−0.6%</div></div>
    <div class="val">3.1%</div>
  </div>
</div>
