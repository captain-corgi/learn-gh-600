<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(8,1fr);gap:18px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .cell i,.cell svg{width:22px;height:22px;stroke-width:1.75;color:var(--fg-1);}
  .lbl{font-size:10px;color:var(--fg-3);font-family:var(--font-mono);}
</style></head>
<body>
<div class="wrap">
  <div class="cell"><i data-lucide="message-circle"></i><span class="lbl">chat</span></div>
  <div class="cell"><i data-lucide="plus"></i><span class="lbl">new</span></div>
  <div class="cell"><i data-lucide="search"></i><span class="lbl">search</span></div>
  <div class="cell"><i data-lucide="settings"></i><span class="lbl">settings</span></div>
  <div class="cell"><i data-lucide="paperclip"></i><span class="lbl">attach</span></div>
  <div class="cell"><i data-lucide="arrow-up"></i><span class="lbl">send</span></div>
  <div class="cell"><i data-lucide="copy"></i><span class="lbl">copy</span></div>
  <div class="cell"><i data-lucide="trash-2"></i><span class="lbl">delete</span></div>
  <div class="cell"><i data-lucide="share-2"></i><span class="lbl">share</span></div>
  <div class="cell"><i data-lucide="sun"></i><span class="lbl">light</span></div>
  <div class="cell"><i data-lucide="moon"></i><span class="lbl">dark</span></div>
  <div class="cell"><i data-lucide="sparkles"></i><span class="lbl">magic</span></div>
  <div class="cell"><i data-lucide="book-open"></i><span class="lbl">docs</span></div>
  <div class="cell"><i data-lucide="user"></i><span class="lbl">user</span></div>
  <div class="cell"><i data-lucide="chevron-down"></i><span class="lbl">more</span></div>
  <div class="cell"><i data-lucide="x"></i><span class="lbl">close</span></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
