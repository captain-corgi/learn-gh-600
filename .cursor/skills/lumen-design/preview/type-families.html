<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Type families</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .wrap{padding:24px 28px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}
  .fam{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--border);padding-left:16px;}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);}
  .big{font-size:44px;line-height:1;color:var(--fg-1);}
  .alpha{font-size:13px;color:var(--fg-2);}
  .name{font-size:13px;font-weight:600;color:var(--fg-1);}
  .serif{font-family:var(--font-serif);}
  .sans{font-family:var(--font-sans);}
  .mono{font-family:var(--font-mono);}
</style></head>
<body>
<div class="wrap">
  <div class="fam">
    <div class="lbl">Serif · Display</div>
    <div class="big serif">Aa</div>
    <div class="name serif">Source Serif 4</div>
    <div class="alpha serif">ABC abc 0123 — “A calm voice.”</div>
  </div>
  <div class="fam">
    <div class="lbl">Sans · UI &amp; body</div>
    <div class="big sans">Aa</div>
    <div class="name sans">Inter</div>
    <div class="alpha sans">ABC abc 0123 — the quick brown fox.</div>
  </div>
  <div class="fam">
    <div class="lbl">Mono · Code</div>
    <div class="big mono">Aa</div>
    <div class="name mono">JetBrains Mono</div>
    <div class="alpha mono">const answer = 42;</div>
  </div>
</div>
</body></html>
