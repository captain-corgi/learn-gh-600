<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Badges</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .wrap{padding:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;border:1px solid transparent;}
  .dot{width:6px;height:6px;border-radius:999px;}
  .neutral{background:var(--surface-2);color:var(--fg-2);border-color:var(--border);}
  .accent{background:var(--accent-bg-soft);color:var(--clay-700);border-color:var(--accent-border);}
  .success{background:#e6f1ea;color:#2b6a45;border-color:#bcdac7;}
  .warning{background:#f8ecd1;color:#7f5b1e;border-color:#e8d39a;}
  .danger{background:#f6dfdb;color:#8f3a2c;border-color:#e6b9b1;}
  .info{background:#dfe9f2;color:#2f567a;border-color:#b7c9de;}
</style></head>
<body>
<div class="wrap">
  <span class="badge neutral"><span class="dot" style="background:var(--fg-3)"></span>Draft</span>
  <span class="badge accent">Sonnet · default</span>
  <span class="badge success"><span class="dot" style="background:#3f8a5c"></span>Saved</span>
  <span class="badge warning">Beta</span>
  <span class="badge danger">Rate limit</span>
  <span class="badge info">Shared</span>
</div>
</body></html>
