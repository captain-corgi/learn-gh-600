<body>
<div class="query-card">
  <div class="query-head">
    <span class="left"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>sql</span>
    <span class="act"><button>Copy</button><button>Run again</button></span>
  </div>
<pre><span class="kw">SELECT</span>
  segment,
  <span class="fn">DATE_TRUNC</span>(<span class="str">'week'</span>, closed_at) <span class="kw">AS</span> week,
  <span class="fn">SUM</span>(amount) <span class="kw">AS</span> revenue
<span class="kw">FROM</span> sales_fact
<span class="kw">WHERE</span> closed_at <span class="kw">BETWEEN</span> <span class="str">'2024-07-01'</span> <span class="kw">AND</span> <span class="str">'2024-09-30'</span>
  <span class="kw">AND</span> stage = <span class="str">'won'</span>
<span class="kw">GROUP BY</span> <span class="num">1</span>, <span class="num">2</span>
<span class="kw">ORDER BY</span> week;</pre>
  <div class="query-foot">Returned <b style="color:#e8dfd1">247</b> rows · 342ms</div>
</div>
