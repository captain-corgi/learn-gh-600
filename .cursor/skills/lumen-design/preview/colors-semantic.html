<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .s{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface);}
  .bar{height:44px;}
  .meta{padding:10px 12px;}
  .name{font-size:12px;font-weight:600;color:var(--fg-1);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:2px;}
</style></head>
<body>
<div class="wrap">
  <div class="s"><div class="bar" style="background:#3f8a5c"></div><div class="meta"><div class="name">Success</div><div class="hex">#3f8a5c</div></div></div>
  <div class="s"><div class="bar" style="background:#c08a2e"></div><div class="meta"><div class="name">Warning</div><div class="hex">#c08a2e</div></div></div>
  <div class="s"><div class="bar" style="background:#b84a3a"></div><div class="meta"><div class="name">Danger</div><div class="hex">#b84a3a</div></div></div>
  <div class="s"><div class="bar" style="background:#3d6f9a"></div><div class="meta"><div class="name">Info</div><div class="hex">#3d6f9a</div></div></div>
</div>
</body></html>
