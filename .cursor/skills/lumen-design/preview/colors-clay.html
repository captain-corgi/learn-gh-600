<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Clay palette</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);}
  .sw{padding:16px 14px;height:112px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-family:var(--font-mono);}
  .name{font-family:var(--font-sans);font-size:12px;font-weight:500;}
  .hex{opacity:.8;}
  .lbl{padding:10px 14px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);background:var(--bg);}
</style></head>
<body>
<div class="lbl">Clay · accent scale</div>
<div class="grid">
  <div class="sw" style="background:#fbeeea;color:#6e2f1b;"><span class="name">clay-50</span><span class="hex">#fbeeea</span></div>
  <div class="sw" style="background:#f4d3c7;color:#6e2f1b;"><span class="name">clay-100</span><span class="hex">#f4d3c7</span></div>
  <div class="sw" style="background:#e9b39f;color:#451d11;"><span class="name">clay-200</span><span class="hex">#e9b39f</span></div>
  <div class="sw" style="background:#dd8e72;color:#451d11;"><span class="name">clay-300</span><span class="hex">#dd8e72</span></div>
  <div class="sw" style="background:#d17352;color:#fff;"><span class="name">clay-400</span><span class="hex">#d17352</span></div>
  <div class="sw" style="background:#c96442;color:#fff;"><span class="name">clay-500 · accent</span><span class="hex">#c96442</span></div>
  <div class="sw" style="background:#b5512f;color:#fff;"><span class="name">clay-600 · hover</span><span class="hex">#b5512f</span></div>
  <div class="sw" style="background:#923f23;color:#fff;"><span class="name">clay-700 · press</span><span class="hex">#923f23</span></div>
  <div class="sw" style="background:#6e2f1b;color:#fff;"><span class="name">clay-800</span><span class="hex">#6e2f1b</span></div>
  <div class="sw" style="background:#451d11;color:#fff;"><span class="name">clay-900</span><span class="hex">#451d11</span></div>
</div>
</body></html>
