<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--warm-cream); }
  .wrap { padding: 22px 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .card { background: white; border: var(--bw) solid var(--border-soft); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 8px; }
  .thumb { aspect-ratio: 16/9; border-radius: var(--r-md); background: linear-gradient(135deg, var(--soft-blue), var(--coat-teal-deep)); position: relative; overflow: hidden; }
  .thumb.blush { background: linear-gradient(135deg, var(--blush-pink), var(--beanie-pink)); }
  .thumb.green { background: linear-gradient(135deg, var(--sage-green-deep), var(--sage-green)); }
  .due { position: absolute; bottom: 6px; right: 6px; background: rgba(42,46,51,0.85); color: white; font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .title { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--ink); line-height: 1.25; letter-spacing: -0.01em; }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
  .dot { width: 3px; height: 3px; background: currentColor; border-radius: 999px; }
  svg.heart { width: 22px; height: 22px; position: absolute; top: 10px; left: 10px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25)); }
</style></head>
<body>
<div class="wrap">
  <div class="card">
    <div class="thumb">
      <svg class="heart" viewBox="0 0 24 24" fill="#E8568A" stroke="#C94572" stroke-width="1.5"><path d="M12 4 C9 1 4 3 4 8 C4 13 10 17 12 20 C14 17 20 13 20 8 C20 3 15 1 12 4 Z"/></svg>
      <span class="due">7:30 AM</span>
    </div>
    <div class="title">Pack school lunch boxes</div>
    <div class="meta">Kitchen<span class="dot"></span>Done</div>
  </div>
  <div class="card">
    <div class="thumb blush"><span class="due">10:00 AM</span></div>
    <div class="title">Grocery run — milk and fruit</div>
    <div class="meta">Errands<span class="dot"></span>Active</div>
  </div>
  <div class="card">
    <div class="thumb green"><span class="due">4:00 PM</span></div>
    <div class="title">Homework help — math worksheet</div>
    <div class="meta">School<span class="dot"></span>Pending</div>
  </div>
</div></body></html>
