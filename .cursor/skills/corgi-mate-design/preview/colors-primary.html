<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--warm-cream); font-family: var(--font-body); color: var(--ink); }
  .wrap { padding: 20px 24px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; aspect-ratio: 1.2; border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border: var(--bw) solid var(--border-soft); position: relative; overflow: hidden; }
  .swatch .name { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.1; }
  .swatch .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; opacity: 0.78; }
  .dark { color: var(--warm-cream); }
  .light { color: var(--ink); }
</style></head>
<body class="cm-body">
<div class="wrap">
  <div class="row">
    <div class="swatch dark" style="background:#E8952E"><span class="name">Mate Orange</span><span class="hex">#E8952E</span></div>
    <div class="swatch dark" style="background:#E8568A"><span class="name">Beanie Pink</span><span class="hex">#E8568A</span></div>
    <div class="swatch light" style="background:#D4A574"><span class="name">Heart Tan</span><span class="hex">#D4A574</span></div>
    <div class="swatch dark" style="background:#4A8B8B"><span class="name">Coat Teal</span><span class="hex">#4A8B8B</span></div>
    <div class="swatch dark" style="background:#9CB898"><span class="name">Sage Green</span><span class="hex">#9CB898</span></div>
    <div class="swatch light" style="background:#F2A8BC"><span class="name">Blush Pink</span><span class="hex">#F2A8BC</span></div>
  </div>
</div></body></html>
