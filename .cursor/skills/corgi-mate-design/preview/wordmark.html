<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--warm-cream); }
  .wrap { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 12px 22px; border-radius: var(--r-md); }
  .row.cream { background: var(--warm-cream-2); }
  .row.dark  { background: var(--ink); }
  .row.teal  { background: var(--soft-blue); }
  .wm { display: flex; align-items: center; gap: 14px; }
  .wm img { width: 52px; height: 52px; }
  .wm-text { display: flex; flex-direction: column; gap: 2px; }
  .wm .name { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; line-height: 1; }
  .wm .slash { font-family: var(--font-display); font-weight: 800; font-size: 12px; letter-spacing: 0.18em; }
  .row.cream .name { color: var(--ink); }
  .row.cream .slash { color: var(--beanie-pink); }
  .row.dark .name { color: var(--warm-cream); }
  .row.dark .slash { color: var(--heart-tan); }
  .row.teal .name { color: var(--warm-cream); }
  .row.teal .slash { color: var(--heart-tan); }
  .note { font-family: var(--font-mono); font-size: 11px; margin-left: auto; }
  .row.cream .note { color: var(--ink-3); }
  .row.dark .note, .row.teal .note { color: rgba(246,242,234,0.65); }
</style></head>
<body>
<div class="wrap">
  <div class="row cream">
    <div class="wm">
      <img src="../assets/icons/heart.svg" alt=""/>
      <span class="wm-text"><span class="name">Corgi Mate</span><span class="slash">/ HOME</span></span>
    </div>
    <span class="note">on Warm Cream</span>
  </div>
  <div class="row teal">
    <div class="wm">
      <img src="../assets/icons/heart.svg" alt=""/>
      <span class="wm-text"><span class="name">Corgi Mate</span><span class="slash">/ HOME</span></span>
    </div>
    <span class="note">on Soft Blue</span>
  </div>
</div></body></html>
