<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Paper palette</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);}
  .sw{padding:16px 14px;height:112px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-family:var(--font-mono);}
  .name{font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:0.02em;}
  .hex{opacity:.75;}
  .lbl{padding:10px 14px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);background:var(--bg);}
</style></head>
<body>
<div class="lbl">Paper · warm neutrals</div>
<div class="grid">
  <div class="sw" style="background:#ffffff;color:#24201a;"><span class="name">paper-0</span><span class="hex">#ffffff</span></div>
  <div class="sw" style="background:#faf7f2;color:#24201a;"><span class="name">paper-50 · bg</span><span class="hex">#faf7f2</span></div>
  <div class="sw" style="background:#f3ede3;color:#24201a;"><span class="name">paper-100</span><span class="hex">#f3ede3</span></div>
  <div class="sw" style="background:#e8dfd1;color:#24201a;"><span class="name">paper-200</span><span class="hex">#e8dfd1</span></div>
  <div class="sw" style="background:#d6cab7;color:#24201a;"><span class="name">paper-300</span><span class="hex">#d6cab7</span></div>
  <div class="sw" style="background:#a99c86;color:#fff;"><span class="name">paper-400</span><span class="hex">#a99c86</span></div>
  <div class="sw" style="background:#7a6e5c;color:#fff;"><span class="name">paper-500</span><span class="hex">#7a6e5c</span></div>
  <div class="sw" style="background:#534a3e;color:#fff;"><span class="name">paper-600</span><span class="hex">#534a3e</span></div>
  <div class="sw" style="background:#39332b;color:#fff;"><span class="name">paper-700</span><span class="hex">#39332b</span></div>
  <div class="sw" style="background:#24201a;color:#fff;"><span class="name">paper-800 · fg</span><span class="hex">#24201a</span></div>
</div>
</body></html>
