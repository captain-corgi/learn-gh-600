<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:14px;}
  .row{display:grid;grid-template-columns:88px 1fr auto;gap:20px;align-items:baseline;}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
  .d{font-family:var(--font-serif);font-weight:400;letter-spacing:-0.02em;line-height:1.08;}
  .h1{font-family:var(--font-serif);font-weight:400;letter-spacing:-0.02em;line-height:1.12;}
  .h2{font-family:var(--font-serif);font-weight:400;letter-spacing:-0.01em;line-height:1.18;}
  .h3{font-family:var(--font-sans);font-weight:600;letter-spacing:-0.01em;}
  .b{font-family:var(--font-sans);font-weight:400;}
  .s{font-family:var(--font-sans);font-weight:400;color:var(--fg-2);}
</style></head>
<body>
<div class="wrap">
  <div class="row"><span class="tag">display</span><span class="d" style="font-size:44px;">A thoughtful companion.</span><span class="meta">56 / 400 / serif</span></div>
  <div class="row"><span class="tag">h1</span><span class="h1" style="font-size:34px;">Rooms for thinking.</span><span class="meta">40 / 400 / serif</span></div>
  <div class="row"><span class="tag">h2</span><span class="h2" style="font-size:26px;">Conversations, curated</span><span class="meta">30 / 400 / serif</span></div>
  <div class="row"><span class="tag">h3</span><span class="h3" style="font-size:20px;">Settings</span><span class="meta">22 / 600 / sans</span></div>
  <div class="row"><span class="tag">body</span><span class="b" style="font-size:16px;">The quick brown fox jumps over the lazy dog.</span><span class="meta">16 / 400 / sans</span></div>
  <div class="row"><span class="tag">small</span><span class="s" style="font-size:14px;">Secondary information and helper text.</span><span class="meta">14 / 400 / sans</span></div>
</div>
</body></html>
