<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px;max-width:520px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-size:12px;font-weight:500;color:var(--fg-2);letter-spacing:0.02em;}
  .inp{font-family:var(--font-sans);font-size:15px;padding:10px 14px;background:var(--surface);color:var(--fg-1);border:1px solid var(--border-strong);border-radius:var(--radius-md);outline:none;transition:border-color var(--dur-fast),box-shadow var(--dur-fast);}
  .inp:focus{border-color:var(--accent);box-shadow:var(--ring);}
  .inp.area{min-height:72px;resize:vertical;font-family:var(--font-sans);line-height:1.55;}
  .hint{font-size:12px;color:var(--fg-3);}
</style></head>
<body>
<div class="wrap">
  <div class="field">
    <label>Display name</label>
    <input class="inp" value="Evelyn Chen"/>
  </div>
  <div class="field">
    <label>Message</label>
    <textarea class="inp area" placeholder="Ask Lumen anything">Write a short poem about the smell of books.</textarea>
    <span class="hint">Shift + return for a new line.</span>
  </div>
</div>
</body></html>
