<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Radii</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:72px;height:72px;background:var(--surface);border:1px solid var(--border-strong);}
  .name{font-size:11px;font-family:var(--font-mono);color:var(--fg-2);}
  .px{font-size:10px;color:var(--fg-3);font-family:var(--font-mono);}
</style></head>
<body>
<div class="wrap">
  <div class="cell"><div class="box" style="border-radius:4px"></div><div class="name">xs</div><div class="px">4</div></div>
  <div class="cell"><div class="box" style="border-radius:6px"></div><div class="name">sm</div><div class="px">6</div></div>
  <div class="cell"><div class="box" style="border-radius:10px"></div><div class="name">md</div><div class="px">10</div></div>
  <div class="cell"><div class="box" style="border-radius:14px"></div><div class="name">lg</div><div class="px">14</div></div>
  <div class="cell"><div class="box" style="border-radius:20px"></div><div class="name">xl</div><div class="px">20</div></div>
  <div class="cell"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="px">∞</div></div>
</div>
</body></html>
