<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"/>
<title>Preview — Data viz palette</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
.grp{padding:14px 18px;}
.lbl{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px;}
.sw{display:inline-flex;flex-direction:column;align-items:center;gap:4px;margin-right:10px;}
.box{width:44px;height:44px;border-radius:8px;}
.name{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);}
.seq{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-radius:8px;overflow:hidden;max-width:420px;}
.seq div{height:32px;}
</style></head>
<body>
<div class="grp">
  <div class="lbl">Categorical · 6 hues</div>
  <div style="display:flex;flex-wrap:wrap">
    <div class="sw"><div class="box" style="background:#c96442"></div><div class="name">chart-1</div></div>
    <div class="sw"><div class="box" style="background:#3d6f9a"></div><div class="name">chart-2</div></div>
    <div class="sw"><div class="box" style="background:#3f8a5c"></div><div class="name">chart-3</div></div>
    <div class="sw"><div class="box" style="background:#c08a2e"></div><div class="name">chart-4</div></div>
    <div class="sw"><div class="box" style="background:#8e5aa0"></div><div class="name">chart-5</div></div>
    <div class="sw"><div class="box" style="background:#5a7a6e"></div><div class="name">chart-6</div></div>
  </div>
</div>
<div class="grp">
  <div class="lbl">Sequential · heatmap</div>
  <div class="seq">
    <div style="background:#faf3ee"></div><div style="background:#f3dcce"></div><div style="background:#e9b99f"></div>
    <div style="background:#dd8e72"></div><div style="background:#c96442"></div><div style="background:#923f23"></div>
  </div>
</div>
<div class="grp">
  <div class="lbl">Diverging · neg / neu / pos</div>
  <div class="seq" style="grid-template-columns:repeat(3,1fr);max-width:220px;">
    <div style="background:#b84a3a"></div><div style="background:#e8dfd1"></div><div style="background:#3f8a5c"></div>
  </div>
</div>
</body></html>
