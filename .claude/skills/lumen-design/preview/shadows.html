<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .wrap{padding:32px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:100%;height:80px;background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border-subtle);}
  .name{font-size:11px;font-family:var(--font-mono);color:var(--fg-2);}
</style></head>
<body>
<div class="wrap">
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="name">shadow-sm · cards</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="name">shadow-md · menus</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="name">shadow-lg · modals</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="name">shadow-xl · overlays</div></div>
</div>
</body></html>
