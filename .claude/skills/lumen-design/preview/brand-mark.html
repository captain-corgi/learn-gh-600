<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Brand Mark</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);min-height:100%;}
  .card{display:grid;grid-template-columns:1fr 1fr;gap:0;height:260px;}
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;}
  .dark{background:#1b1814;color:#f0eadf;}
  .mark{width:84px;height:84px;color:var(--accent);}
  .dark .mark{color:#d97757;}
  .word{font-family:var(--font-serif);font-size:32px;letter-spacing:-0.01em;}
  .sub{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);}
  .dark .sub{color:#968b78;}
</style></head>
<body>
<div class="card">
  <div class="cell">
    <svg class="mark" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 2 C 30 2, 36 10, 36 20 C 36 28, 31 34, 25 37 L 25 39 Q 25 40, 23.5 40 L 16.5 40 Q 15 40, 15 39 L 15 37 C 9 34, 4 28, 4 20 C 4 10, 10 2, 20 2 Z"/><circle cx="20" cy="19" r="6"/></svg>
    <div class="word">Lumen</div>
    <div class="sub">Light</div>
  </div>
  <div class="cell dark">
    <svg class="mark" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 2 C 30 2, 36 10, 36 20 C 36 28, 31 34, 25 37 L 25 39 Q 25 40, 23.5 40 L 16.5 40 Q 15 40, 15 39 L 15 37 C 9 34, 4 28, 4 20 C 4 10, 10 2, 20 2 Z"/><circle cx="20" cy="19" r="6"/></svg>
    <div class="word">Lumen</div>
    <div class="sub">Dark</div>
  </div>
</div>
</body></html>
