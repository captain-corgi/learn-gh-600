<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Preview — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg-1);}
  .wrap{padding:24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .btn{font-family:var(--font-sans);font-size:14px;font-weight:500;padding:10px 18px;border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;transition:all var(--dur-fast) var(--ease-out);line-height:1.2;}
  .primary{background:var(--accent);color:var(--accent-fg);}
  .primary:hover{background:var(--accent-hover);}
  .secondary{background:var(--surface);color:var(--fg-1);border-color:var(--border-strong);}
  .secondary:hover{background:var(--surface-2);}
  .ghost{background:transparent;color:var(--fg-1);}
  .ghost:hover{background:var(--surface-2);}
  .danger{background:#b84a3a;color:#fff;}
  .pill{border-radius:var(--radius-pill);}
  .small{font-size:13px;padding:6px 12px;}
  .icon{display:inline-flex;align-items:center;gap:6px;}
  svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;}
</style></head>
<body>
<div class="wrap">
  <button class="btn primary">Send message</button>
  <button class="btn secondary">Cancel</button>
  <button class="btn ghost">Settings</button>
  <button class="btn danger">Delete</button>
  <button class="btn primary pill icon"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>Continue</button>
  <button class="btn secondary small">New chat</button>
  <button class="btn primary" disabled style="opacity:.5;cursor:not-allowed;">Disabled</button>
</div>
</body></html>
