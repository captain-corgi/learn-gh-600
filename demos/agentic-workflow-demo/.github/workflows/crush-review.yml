name: crush-review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      contains(github.event.label.name, 'review-requested') ||
      github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Crush
        # Pinned to a specific version instead of @latest for reproducible,
        # auditable builds (supply-chain hardening).
        run: go install github.com/charmbracelet/crush@v0.79.1

      - name: Configure model
        env:
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-3-5-haiku-20241022' }}
        run: |
          # Inject configurable model ID into crush.json
          jq --arg m "$REVIEW_MODEL" '.model=$m' crush.json > /tmp/crush.json
          mv /tmp/crush.json crush.json

      - name: Run Crush review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          crush --yolo --cwd . \
            "Review the code changes in this PR. Focus on:
            1. BUGS: Race conditions, logic errors, nil pointers
            2. SECURITY: Input validation, injection, secret exposure
            3. GO IDIOMS: Error handling, stdlib usage, naming
            4. TESTS: Coverage gaps, weak assertions

            For each finding: severity (critical/warning/info) and fix suggestion.
            Pay special attention to any shared counter/state that lacks synchronization." \
            > /tmp/crush-review.md || true

          # If crush produced no output, write a fallback
          if [ ! -s /tmp/crush-review.md ]; then
            echo "Crush completed with no findings." > /tmp/crush-review.md
          fi

      - name: Post Crush review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Build the comment body in a file and post it via --body-file so the
          # (model-generated, untrusted) review text never passes through the
          # shell command line or interpolation.
          {
            printf '## Crush Code Review\n\n'
            cat /tmp/crush-review.md
            printf '\n---\n*Generated by Crush via Anthropic API (Claude)*\n'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
