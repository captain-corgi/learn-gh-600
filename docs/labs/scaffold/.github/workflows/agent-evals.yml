name: agent-evals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
          cache: true
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out ./...
      - name: Build eval report
        run: |
          mkdir -p evals
          coverage=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}')
          cat > evals/report.md <<EOF
          # Agent eval report

          | Signal | Result |
          | --- | --- |
          | Coverage | ${coverage} |
          | Reasoning errors | Review PR plan and comments |
          | Tool errors | Review workflow logs |
          | Context/environment errors | Review skipped or missing env assumptions |

          ## Tuning notes

          Record whether the next run needs instruction, memory, or tool-access changes.
          EOF
      - name: Upload eval report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-eval-report
          path: evals/report.md
